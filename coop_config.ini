; CoopMod proxy settings (read once at game start; every key is optional)

[proxy]
; Enemy difficulty (host): easy = the co-op baseline, medium = enemies deal x1.6 damage and have x1.6 health, hard = x2 both, veteran = x2.5, insane = x3, brutal = x4, deadly = x5, hell = x6, impossible = x8.
; Change it in game with the chat command /difficulty easy|medium|hard|veteran|insane|brutal|deadly|hell|impossible (or 1-9; it is saved here).
difficulty=hard
; Champions per champion fight (host): 1 = solo rules, 2 or 3 = the level's other champions join in.
; Change it in game with /champions 1|2|3 (saved here).
champions=3

; Before a level starts, the engine asks every entity whether it is ready.
; In multiplayer, some campaign entity answers "no", so the round never begins
; and the game crashes as soon as you connect. With 1, the proxy logs which
; entity said no and answers "ready" for it. Set 0 to see the original behaviour.
force_begin_play=1

; When the engine fails to load one entity of a level's scene it aborts the
; whole scene, and the level never starts. With 1, the proxy logs the failure
; (with the engine's own reason) and skips just that entity.
skip_failed_entities=1

; Multiplayer never starts a level's mission scripts (InitLevel / OnMissionBegins
; only run in solo). With 1, the host starts them when its player first spawns:
; intro, enemies, objectives. 0 = off. 2 = start without waiting for a player
; (only for testing on the dedicated server).
run_mission_scripts=1

; Multiplayer only creates a character's weapons (from its Arsenal) and armor in
; solo, so campaign NPCs were unarmed. With 1, NPC characters (not players) get
; their campaign equipment. 0 = off.
npc_equipment=1

; Saving at a save station stops a multiplayer game, and a co-op session cannot be
; loaded back as co-op. With 0 the station is still used (objectives continue) but
; the game is not saved. 1 = let it save anyway.
coop_save=0

; Multiplayer never builds the AI world (only solo games do, when a level
; starts), so campaign NPCs stood still: no walking to waypoints, following,
; patrolling or fighting, and cut-scenes that wait for an NPC to walk somewhere
; (COOP_Patrol after the save station) never ended. With 1 the host builds it
; when the mission starts. The level's AI data must be in
; Mods\Bos\Levels\<level>\AI. 0 = off.
ai_init=1

; Co-op layer run on the host when the mission starts: no cut-scenes (camera
; sequences are skipped and the story goes straight on), no dialogue, no black
; bars, never locks or teleports you. Set CoopCine_Skip = false at the top of
; coop_mission.lua to get the cut-scenes back. Empty = off.
coop_lua=coop_mission.lua

; Admin commands (host, 0.31): type them in the chat, e.g. /help, /goto <player>, /bring all,
; /tp me -2500 1400 30, /pos, /save, /back, /heal all, /ammo all, /god, /players, /restart.
; Host hotkeys: Ctrl+F5 jump 3 m forward, Ctrl+F6 through the nearest door, Ctrl+F7 unlock+open the
; nearest door, Ctrl+F8 undo the last jump, Ctrl+F9 bring everyone to you, Ctrl+F10 go to the other player,
; Ctrl+F11 heal + refill ammo for everyone, Ctrl+F12 god mode on/off for you.
; admin_clients=0: only the host may use the commands. admin=0: all off.
admin=1
admin_clients=1
admin_hotkeys=1

; 0.34: the host builds the champion fight's intro camera rig (solo does it at level start; MP
; never did, and Master Loa's intro crashed the host). 0 = old behaviour.
coop_bos_camera=1
; 0.34: a client predicting ahead seeds each entity's random numbers (weapon spread, recoil) with
; the frame it is simulating, like the host, instead of the last confirmed one. 0 = old behaviour.
net_rng_frame=1

; 0.35: the champion fight's countdown ends the solo way (BOS cinematic manager -> combat) instead of the
; MP BOS mode's round start, which needs an arena entity campaign maps don't have (crash at Bos+0x6A16F).
coop_bos_countdown=1

; 0.36 diagnostic (host only): 0 = human characters get no AI agent (enemies then ignore players).
ai_humans=1

; 0.37: bullets/projectiles in flight are not part of the world check (1 = check them again).
net_csum_bullets=0

; 0.40: at least this many seconds between resyncs (client skips its world check meanwhile). OFF (0) - the
; 0.38 version made things worse (more resyncs, NPCs vanished). Experimental, leave at 0 unless asked.
; Lower it if the other player's view drifts too far, raise it for fewer snaps. Read by the client.
net_resync_gap=0

; 0.45: the host sends a resync 1 frame after the client's request instead of 2 (about 60 ms less
; freeze per resync). 0 = engine behaviour. Read by the host.
net_resync_early=1
; 0.67: a world difference must last this many frames (16 per second) before the client asks for a
;   resync; shorter ones are left alone (most are fixed by the host's per-frame state). 0 = engine (at once).
net_resync_patience=32
; 0.67: 1 = mission timers, objectives, champion fight, AI orders and cut-scene cameras count in the checksum again
net_csum_script=0
; 0.67: 1 = the host sends its timers / objectives / champion fight state every frame
net_script_state=1
; 0.68: 1 = the host sends the players' State flags (stance) and aim spread every frame
net_human_state=1
; 0.69: party lives (chat: /lives 10 restart, /lives off, /wipe restart). 0 = unlimited.
;   lives_action / wipe_action: restart (restart the mission), warn (chat message only), off
party_lives=1
lives_action=restart
wipe_action=off

; 0.46: up to 160 fragment datagrams per send (proxy default 64, engine 1). A resync is ~73, so it now
; leaves in one send instead of two frames. Read by the host.
net_fragments=160

; 0.47: NPCs are frozen/unfrozen (scripts' FreezeAll etc.) through the NPC frame table, at the same frame
; on both PCs. 0 = old behaviour (host only, fixed by the next resync).
net_sync_freeze=1
; 0.62: the host sends its NPC characters' state at the end of every frame; the client writes it into its NPCs
; before simulating the next frame (the engine's own import), so a fight can no longer drift apart. 0 = off.
net_npc_state=1
; 0 = NPC characters are left out of the world checksum (they come from the host every frame); humans still count.
; BOTH PCs need the same value and proxy 0.62, or every check fails.
net_csum_npcs=0
; 0.63: if the game is left in GUI input mode with no screen and no chat (all control lost), give the input back after 1 s. Ctrl+F4 does it by hand.
input_fix=1
; 0.64: 0 = camera cut-scenes are not shown on clients (the champion intro froze the client's camera); 1 = shown
client_cutscenes=0
; 0.65: 1 = on a client, a character the host teleported (seen only through a resync) is re-placed the way the host's teleport did (fixes the frozen camera after the champion set-up); 0 = off
client_teleport_fix=0
; 0.47: props' gas-leak point / last shooter and a group's own Freeze flag are not part of the world
; check (cosmetic). 1 = check them again.
net_csum_cosmetic=0

; 0.49: physics props (crates, barrels: 144 on COOP_Patrol_2) are removed in co-op. PhysX gives different
; results on two PCs, so touching a crate made the worlds drift apart (the main resync cause). 0 = keep them.
; Both PCs must use the same value.
coop_remove_props=1

; 0.71 revive: downed players can be revived by standing next to the body
revive=1
revive_time=4
revive_radius=30
revive_bleedout=90
revive_key=32
; 0.79: minimap icon type for a downed teammate (2 = objective icon, 4 = mercenary, 0 = off)
revive_marker=2
; 0.79: in-game co-op menu: menu=1 on, menu_key = virtual key code (45 = Insert)
menu=1
menu_key=45

; 0.73 mission-honest class kits (Tuning\Multiplayer\Coop\Equipments_<level>.cfg)
coop_kits=1

[next_level]
; The co-op campaign in the story order (Script\ManageLevels.lua): when a level is finished the host
; restarts the session on the next one and the clients follow. <level>=- ends the chain (the server's
; own map cycle). Change a line to skip or reorder levels.
; After Tanks in the City the campaign lets you choose: this chain takes the refusal (Good Choice ->
; Resistance); for the other ending host COOP_Eradication_1 from the map list.
COOP_Patrol=COOP_Patrol_2
COOP_Patrol_2=COOP_Big_Boy_1
COOP_Big_Boy_1=COOP_Big_Boy_2
COOP_Big_Boy_2=COOP_Big_Boy_4
COOP_Big_Boy_4=COOP_Cargo_Bay_1
COOP_Cargo_Bay_1=COOP_Cargo_Bay_2
COOP_Cargo_Bay_2=COOP_Cargo_Bay_3
COOP_Cargo_Bay_3=COOP_Alaska_Special_Forces_1
COOP_Alaska_Special_Forces_1=COOP_Alaska_Special_Forces_2
COOP_Alaska_Special_Forces_2=COOP_Convoy
COOP_Convoy=COOP_Hold_that_Point_1
COOP_Hold_that_Point_1=COOP_Hold_that_Point_2
COOP_Hold_that_Point_2=COOP_Hold_that_Point_3
COOP_Hold_that_Point_3=COOP_Tanks_in_the_city_1
COOP_Tanks_in_the_city_1=COOP_Tanks_in_the_city_2
COOP_Tanks_in_the_city_2=COOP_Tanks_in_the_city_3
COOP_Tanks_in_the_city_3=COOP_Tanks_in_the_city_4
COOP_Tanks_in_the_city_4=COOP_Good_Choice
COOP_Good_Choice=COOP_Resistance_1
COOP_Resistance_1=COOP_Resistance_2
COOP_Resistance_2=COOP_Resistance_3
COOP_Resistance_3=-
COOP_Eradication_1=COOP_Eradication_2
COOP_Eradication_2=COOP_Eradication_3
COOP_Eradication_3=-

[movies]
; The campaign's story movies (Mods\Bos\Movies\EN), played on every PC when the level loads, before you
; spawn - once per game session (a restart after a failed mission does not replay them). Several
; movies: comma-separated, in order. Remove a line to drop a movie; [proxy] coop_movies=0 turns them off.
COOP_Patrol=1_Prologue.ktm,2_Intro.ktm,3_Peter_Rossbach.ktm
COOP_Big_Boy_1=4_Revenge.ktm
COOP_Cargo_Bay_1=5_Nolan_Is_Alive.ktm
COOP_Alaska_Special_Forces_1=6_Mika_Boryenka.ktm
COOP_Convoy=7_Remember.ktm
COOP_Tanks_in_the_city_1=8_Monastery.ktm
COOP_Good_Choice=9_Blackmail.ktm
COOP_Eradication_1=9_Blackmail.ktm
COOP_Resistance_1=10_B_Resistance.ktm

[movies_after]
; The endings: played when the next level loads after leaving this one (the campaign ends here).
COOP_Resistance_3=10_B_Resistance_End.ktm,11_Epilogue.ktm
COOP_Eradication_3=10_A_Eradication_End.ktm,11_Epilogue.ktm
